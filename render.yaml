services:
  - type: web
    name: mini-callflix-signal
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      # Set in the Render dashboard (sync:false): exact Vercel origin,
      # e.g. https://<project>.vercel.app or your custom domain (never "*").
      - key: CLIENT_ORIGIN
        sync: false