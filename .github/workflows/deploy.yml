name: Deploy to Vercel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel (production)
        run: npx vercel --prod --yes --token "${{ secrets.VERCEL_TOKEN }}" --build-env VITE_SERVER_URL=https://mini-callflix-signal.onrender.com